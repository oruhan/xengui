name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev pkg-config

      - name: Install stable Rust and cross-platform targets
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown,aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run all quality gates
        run: cargo xtask quality

  msrv:
    name: Minimum supported Rust 1.92
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev pkg-config

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check workspace with MSRV
        run: cargo check --workspace --all-targets --locked
