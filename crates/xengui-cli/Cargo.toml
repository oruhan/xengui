[package]
name = "xengui-cli"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Workspace development and release tooling for XenGui"
publish = false

[[bin]]
name = "xengui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive"] }
semver = "1.0"
toml_edit = "0.25"

[lints]
workspace = true
